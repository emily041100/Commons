<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233B"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>우리 가계부</title>
<style>
:root{--bg:#EDF0F4;--ink:#16233B;--mut:#6B778C;--ln:#D9DEE6;--up:#D63B3B;--dn:#2F6FDB;--inc:#0E8A7D}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{padding:calc(16px + env(safe-area-inset-top)) 16px 150px;max-width:520px;margin:0 auto}
button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;color:var(--mut);font-weight:600}nav .on{color:var(--ink);box-shadow:inset 0 3px var(--ink)}
#fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;font-size:28px}
.up{color:var(--up)}.dn{color:var(--dn)}.inc{color:var(--inc)}small,.em{color:var(--mut);font-size:13px}
h3{margin:22px 4px 8px;font-size:15px}
.mn{display:flex;justify-content:space-between;align-items:center;font-size:18px}.mn button{font-size:24px;padding:4px 14px}
.sum{display:flex;justify-content:space-between;margin:6px 4px 10px;font-weight:600}
.dh{margin:14px 4px 6px;color:var(--mut);font-size:13px}
.it,.cd,.cr{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:6px}.cd{border-radius:14px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}.it small{display:block}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:20px;margin-bottom:10px}.hero b{display:block;font-size:30px;line-height:1.2}
.hero span{display:inline-block;margin:6px 14px 0 0;opacity:.8;font-size:13px}
.ct{display:flex;justify-content:space-between}.bar{height:8px;background:var(--ln);border-radius:4px;margin:6px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}.bar.over i{background:var(--up)}
.nt{background:#FFF4D6;border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}.nt button{display:block;margin-top:8px;font-weight:700;text-decoration:underline}
.cd svg{width:100%;height:auto}polyline{fill:none;stroke:var(--ink);stroke-width:2}.ax{display:flex;justify-content:space-between}
.rg{display:flex;gap:6px;margin:4px 0}.rg button,.chips button{border:1px solid var(--ln);border-radius:999px;padding:5px 14px;background:#fff}
.rg .on,.chips .on,.seg .on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#sheet{position:fixed;inset:0;background:rgba(22,35,59,.45);display:flex;align-items:flex-end}#sheet[hidden]{display:none}
.pn{background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:520px;margin:0 auto}
.seg{display:flex}.seg button{flex:1;padding:8px;border:1px solid var(--ln)}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
input:not([type=checkbox]),select{width:100%;border:1px solid var(--ln);border-radius:10px;padding:10px;margin:6px 0;background:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.pri,.del{padding:12px;border-radius:10px;text-align:center;font-weight:700}
.pri{background:var(--ink);color:#fff}.del{border:1px solid var(--up);color:var(--up)}.fl{display:block;font-size:13px;color:var(--mut)}.sw{display:block;margin-top:10px}
</style></head><body>
<main id="v"></main>
<button id="fab" data-a="add" aria-label="내역 추가">＋</button>
<nav><button data-t="tx">내역</button><button data-t="st">통계</button><button data-t="as">자산</button><button data-t="se">설정</button></nav>
<div id="sheet" hidden></div>
<script src="app.js"></script>
</body></html>
